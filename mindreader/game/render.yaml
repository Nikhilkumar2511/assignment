# Render blueprint: New > Blueprint, point it at this repository (root: mindreader/game).
services:
  - type: web
    name: mindreader
    runtime: docker
    rootDir: mindreader/game
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
