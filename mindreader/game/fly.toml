# Fly.io: `fly launch --no-deploy`, then
#   fly secrets set TOKEN_SECRET=$(openssl rand -hex 32) ADMIN_TOKEN=$(openssl rand -hex 24)
#   fly secrets set DATABASE_URL=postgres://...        (optional: learning and moderation)
#   fly volumes create snapshots --size 3 --region bom  (full character set, see README)
#   fly deploy
app = "mindreader"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SNAPSHOT_DIR = "/app/data/seed"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 40

[[http_service.checks]]
  path = "/v1/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
